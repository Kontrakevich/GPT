<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#8b4f63">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Диалог пары">
<title>Диалог пары</title>
<style>
:root{--bg:#f4f1ec;--card:#fffdfa;--text:#211f1d;--muted:#736d66;--line:#ddd6cd;--accent:#8b4f63;--accent-soft:#ead7de;--good:#44745a;--warn:#98603b}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{min-height:100vh}.app{max-width:680px;margin:0 auto;padding:16px 14px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin:8px 0 18px}.badge{font-size:12px;font-weight:700;color:var(--muted);background:#ebe5de;padding:7px 10px;border-radius:999px}.progress{font-size:13px;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 12px 34px rgba(30,20,15,.06)}h1{font-size:34px;line-height:1.04;margin:0 0 14px}h2{font-size:25px;line-height:1.15;margin:0 0 12px}h3{font-size:19px;margin:0 0 10px}p{line-height:1.5}.lead{font-size:18px;color:var(--muted)}.note{font-size:14px;color:var(--muted);line-height:1.5}.quote{border-left:4px solid var(--accent);padding-left:14px;font-size:19px;line-height:1.45}input,textarea,select{width:100%;border:1px solid var(--line);background:white;border-radius:16px;padding:15px;font:inherit;color:var(--text);outline:none}textarea{min-height:150px;resize:none}input:focus,textarea:focus,select:focus{border-color:var(--accent)}label{display:block;font-weight:700;margin:14px 0 8px}.actions{display:grid;gap:10px;margin-top:18px}button{border:0;border-radius:16px;padding:15px 18px;font:inherit;font-weight:800;cursor:pointer;min-height:52px}.primary{background:var(--accent);color:white}.secondary{background:#e9e3dc;color:var(--text)}.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}.danger{background:#f2dfdc;color:#7b3028}.counter{font-size:14px;color:var(--muted);margin-bottom:10px}.answer-card{border:1px solid var(--line);border-radius:18px;padding:18px;background:#fff;margin:14px 0}.answer-text{font-size:21px;line-height:1.45;white-space:pre-wrap}.timer{width:120px;height:120px;border-radius:50%;margin:20px auto;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);font-size:34px;font-weight:800;color:var(--accent)}.checks{display:grid;gap:10px;margin-top:14px}.check{display:flex;gap:12px;align-items:flex-start;padding:13px;border-radius:14px;background:#f3eee8;font-size:15px;line-height:1.35}.check input{width:22px;height:22px;margin:0;flex:0 0 auto}.pill{display:inline-block;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800;margin-bottom:10px}.good{background:#dcebe2;color:var(--good)}.warn{background:#f0dfd2;color:var(--warn)}.center{text-align:center}@media(max-width:420px){h1{font-size:30px}}footer{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
</style>
</head>
<body>
<div class="app"><div class="top"><div class="badge">Диалог пары · v0.3.0</div><div class="progress" id="progress">Шаг 1</div></div><main id="screen" class="card"></main><footer>Ответы хранятся только в браузере этого устройства.</footer></div>
<script>
const K='relationship_dialogue_v030';const s={step:'intro',names:{a:'Михаил',b:'Снежа'},current:'a',phase:'good',index:0,answers:{a:{good:['','',''],bad:['','','']},b:{good:['','',''],bad:['','','']}},discussionOrder:[],discussionIndex:0,reflectionSeconds:30,timer:null,timerLeft:0};function save(){localStorage.setItem(K,JSON.stringify({...s,timer:null}))}function restore(){try{Object.assign(s,JSON.parse(localStorage.getItem(K)||'{}'));s.timer=null}catch{}}function esc(x){const d=document.createElement('div');d.textContent=x;return d.innerHTML}function setProgress(t){progress.textContent=t}function render(){clearInterval(s.timer);s.timer=null;const e=screen;if(s.step==='intro')intro(e);else if(s.step==='names')names(e);else if(s.step==='handoff')handoff(e);else if(s.step==='answer')answer(e);else if(s.step==='ready')ready(e);else if(s.step==='discussion')discussion(e);else if(s.step==='pause')pause(e);else if(s.step==='reflect')reflect(e);else finish(e);save()}function intro(e){setProgress('Начало');e.innerHTML=`<h1>Разговор без спора</h1><p class="lead">Один телефон. Каждый отвечает отдельно. Затем вы обсуждаете ответы по одному.</p><p class="quote">Задача — не доказать свою правоту, а понять, как ваши действия влияют друг на друга.</p><div class="actions"><button class="primary" onclick="s.step='names';render()">Начать</button><button class="ghost" onclick="resetAll()">Удалить старые ответы</button></div>`}function names(e){setProgress('Настройка');e.innerHTML=`<h2>Кто участвует</h2><label>Первый участник</label><input id="a" value="${esc(s.names.a)}"><label>Второй участник</label><input id="b" value="${esc(s.names.b)}"><label>Пауза перед ответом</label><select id="sec"><option>15</option><option selected>30</option><option>60</option></select><p class="note">После ответа одного участника экран попросит передать телефон другому.</p><div class="actions"><button class="primary" onclick="start()">Продолжить</button></div>`}function start(){s.names.a=a.value.trim()||'Участник 1';s.names.b=b.value.trim()||'Участник 2';s.reflectionSeconds=+sec.value;s.current='a';s.phase='good';s.index=0;s.step='handoff';render()}function handoff(e){setProgress('Передача телефона');e.innerHTML=`<div class="center"><h2>Передайте телефон</h2><p class="lead">Сейчас отвечает <strong>${esc(s.names[s.current])}</strong>.</p><p class="note">Другой участник не смотрит на экран и не комментирует ответы.</p><div class="actions"><button class="primary" onclick="s.step='answer';render()">Я готов(а)</button></div></div>`}function answer(e){const good=s.phase==='good',q=good?'Назови три вещи, которые сильнее всего укрепляют твою любовь ко мне.':'Назови три вещи, которые постепенно ослабляют твою любовь ко мне.';setProgress(`${s.names[s.current]} · ${s.index+1}/3`);e.innerHTML=`<span class="pill ${good?'good':'warn'}">${good?'Укрепляет':'Ослабляет'}</span><h2>${q}</h2><div class="counter">Ответ ${s.index+1} из 3</div><textarea id="ans" placeholder="Когда происходит…, я чувствую…">${esc(s.answers[s.current][s.phase][s.index]||'')}</textarea><p class="note">Опишите конкретное действие и свои чувства. Избегайте «ты всегда» и «ты никогда».</p><div class="actions"><button class="primary" onclick="nextAnswer()">Сохранить и дальше</button></div>`}function nextAnswer(){const t=ans.value.trim();if(!t)return alert('Сначала запишите ответ.');s.answers[s.current][s.phase][s.index]=t;if(s.index<2){s.index++;return render()}if(s.phase==='good'){s.phase='bad';s.index=0;return render()}if(s.current==='a'){s.current='b';s.phase='good';s.index=0;s.step='handoff';return render()}prepare()}function prepare(){s.discussionOrder=[];for(let i=0;i<3;i++){s.discussionOrder.push({person:'a',phase:'good',index:i},{person:'b',phase:'good',index:i})}for(let i=0;i<3;i++){s.discussionOrder.push({person:'a',phase:'bad',index:i},{person:'b',phase:'bad',index:i})}s.discussionIndex=0;s.step='ready';render()}function ready(e){setProgress('Оба ответили');e.innerHTML=`<div class="center"><h2>Ответы сохранены</h2><p class="lead">Теперь садитесь рядом. Ответы будут показаны по одному.</p><p class="quote">Сначала слушаем. Потом уточняем. Только после паузы отвечаем.</p><div class="actions"><button class="primary" onclick="s.step='discussion';render()">Начать совместный разговор</button></div></div>`}function item(){return s.discussionOrder[s.discussionIndex]}function discussion(e){const i=item();if(!i){s.step='finish';return render()}const good=i.phase==='good';setProgress(`Обсуждение ${s.discussionIndex+1}/${s.discussionOrder.length}`);e.innerHTML=`<span class="pill ${good?'good':'warn'}">${good?'Укрепляет любовь':'Ослабляет любовь'}</span><h2>Ответ: ${esc(s.names[i.person])}</h2><div class="answer-card"><div class="answer-text">${esc(s.answers[i.person][i.phase][i.index])}</div></div><h3>Сначала уточните</h3><div class="checks"><label class="check"><input type="checkbox" id="c1">Какое конкретное действие ты имеешь в виду?</label><label class="check"><input type="checkbox" id="c2">Что ты чувствуешь, когда это происходит?</label><label class="check"><input type="checkbox" id="c3">Какой небольшой и реалистичный шаг изменит ситуацию?</label><label class="check"><input type="checkbox" id="c4">Правильно ли я тебя понял(а)?</label></div><div class="actions"><button class="primary" onclick="beginPause()">Мы обсудили и готовы к паузе</button></div>`}function beginPause(){if(![c1,c2,c3,c4].every(x=>x.checked))return alert('Сначала пройдите все четыре вопроса.');s.timerLeft=s.reflectionSeconds;s.step='pause';render()}function pause(e){setProgress('Пауза перед реакцией');e.innerHTML=`<div class="center"><h2>Не отвечайте сразу</h2><p class="lead">Подумайте не о том, как возразить, а о том, что сейчас важно другому человеку.</p><div class="timer" id="tm">${s.timerLeft}</div><div class="actions"><button id="cb" class="secondary" disabled onclick="s.step='reflect';render()">Пауза продолжается</button></div></div>`;s.timer=setInterval(()=>{s.timerLeft--;tm.textContent=s.timerLeft;if(s.timerLeft<=0){clearInterval(s.timer);cb.disabled=false;cb.className='primary';cb.textContent='Я подумал(а). Продолжить'}},1000)}function reflect(e){const i=item(),listener=i.person==='a'?s.names.b:s.names.a;setProgress('Ответ после паузы');e.innerHTML=`<h2>Теперь отвечает ${esc(listener)}</h2><p class="lead">Начните не с возражения, а с признания услышанного.</p><p class="quote">«Я услышал(а), что для тебя важно…»</p><p class="note">Назовите один конкретный шаг, который действительно готовы попробовать.</p><div class="actions"><button class="primary" onclick="s.discussionIndex++;s.step=s.discussionIndex>=s.discussionOrder.length?'finish':'discussion';render()">Обсудили → следующий ответ</button></div>`}function finish(e){setProgress('Завершено');e.innerHTML=`<div class="center"><h1>Разговор завершён</h1><p class="lead">Вы не обязаны решить всё за один раз. Важно, что оба получили возможность быть услышанными.</p><p class="quote">Выберите по одному небольшому действию с каждой стороны на ближайшую неделю.</p><div class="actions"><button class="secondary" onclick="s.discussionIndex=0;s.step='discussion';render()">Просмотреть разговор ещё раз</button><button class="danger" onclick="resetAll()">Удалить ответы и начать заново</button></div></div>`}function resetAll(){if(confirm('Удалить все ответы и начать заново?')){localStorage.removeItem(K);location.reload()}}restore();render();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
